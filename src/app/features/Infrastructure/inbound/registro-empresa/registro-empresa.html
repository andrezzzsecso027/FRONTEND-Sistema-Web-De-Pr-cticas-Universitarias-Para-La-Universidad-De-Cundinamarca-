<app-navbar></app-navbar>

<main class="auth">
  <h1>Registro Corporativo</h1>

  <form class="auth-form">
    <label for="nit">NIT (Sin dígito de verificación)</label>
    <input type="text" id="nit" name="nit" placeholder="Ej. 900123456">

    <label for="razonSocial">Razón Social</label>
    <input type="text" id="razonSocial" name="razonSocial" placeholder="Nombre legal de la empresa">

    <label for="direccionEmpresa">Dirección de la Sede Principal</label>
    <input type="text" id="direccionEmpresa" name="direccionEmpresa">

    <label for="telefonoEmpresa">Teléfono de Contacto</label>
    <input type="tel" id="telefonoEmpresa" name="telefonoEmpresa">

    
    <label for="tipoEmpresa">Tipo de Empresa</label>
    <select id="tipoEmpresa" name="tipoEmpresa">
      <option value="">Seleccione el tipo legal...</option>
      <option value="SAS">S.A.S. (Sociedad por Acciones Simplificada)</option>
      <option value="LTDA">Sociedad Limitada (Ltda.)</option>
      <option value="SA">Sociedad Anónima (S.A.)</option>
      <option value="ESAL">Fundación / ONG (Sin Ánimo de Lucro)</option>
      <option value="PUBLICA">Entidad del Estado / Pública</option>
      <option value="OTRA">Otra</option>
    </select>

    <label for="correo">Correo de contacto corporativo</label>
    <input type="email" id="correo" name="correo">

    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave">
    <button type="submit">Solicitar registro</button>
  </form>

  <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</main>

<app-footer></app-footer>
