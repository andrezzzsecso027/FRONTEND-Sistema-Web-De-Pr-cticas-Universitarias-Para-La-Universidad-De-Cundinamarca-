<app-navbar></app-navbar>

<main class="auth">
  <h1>Registro Corporativo</h1>

 <form class="auth-form" [formGroup]="formularioEmpresa" (ngSubmit)="onSubmit()">
  
  <label for="nit">NIT</label>
  <input type="text" id="nit" formControlName="nit">

  <label for="nombreEmpresa">Razón Social</label>
  <input type="text" id="nombreEmpresa" formControlName="nombreEmpresa">

  <label for="tipoEmpresa">Tipo de Empresa</label>
  <select id="tipoEmpresa" formControlName="tipoEmpresa">
      <option value="SAS">S.A.S. (Sociedad por Acciones Simplificada)</option>
      <option value="LTDA">Sociedad Limitada (Ltda.)</option>
      <option value="SA">Sociedad Anónima (S.A.)</option>
      <option value="ESAL">Fundación / ONG (Sin Ánimo de Lucro)</option>
      <option value="PUBLICA">Entidad del Estado / Pública</option>
      
  </select>

  <label for="direccionEmpresa">Dirección</label>
  <input type="text" id="direccionEmpresa" formControlName="direccionEmpresa">

  <label for="telefonoEmpresa">Teléfono</label>
  <input type="tel" id="telefonoEmpresa" formControlName="telefonoEmpresa">

  <label for="correo">Correo corporativo</label>
  <input type="email" id="correo" formControlName="correo">

  <label for="contrasenia">Contraseña</label>
  <input type="password" id="contrasenia" formControlName="contrasenia">

  <button type="submit" [disabled]="formularioEmpresa.invalid">Solicitar registro</button>
</form>

  <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</main>

<app-footer></app-footer>
