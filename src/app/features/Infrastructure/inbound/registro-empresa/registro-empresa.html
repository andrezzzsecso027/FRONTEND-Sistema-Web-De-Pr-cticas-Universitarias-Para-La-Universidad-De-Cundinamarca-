<app-navbar></app-navbar>

<main class="auth">
  <h1>Registro Corporativo</h1>
  <p class="auth-subtitle">Completa la información para unir tu empresa a nuestra red</p>

  <form class="auth-form" [formGroup]="formularioEmpresa" (ngSubmit)="onSubmit()">

    <div class="form-grid">

      <div class="form-column">
        <h3>Datos de la Empresa</h3>

        <label for="nit">NIT</label>
        <input type="text" id="nit" formControlName="nit" placeholder="Ej: 900123456-7">

        <label for="nombreEmpresa">Razón Social</label>
        <input type="text" id="nombreEmpresa" formControlName="nombreEmpresa" placeholder="Ej: Mi Empresa S.A.S.">

        <label for="legalName">Nombre Legal de la Empresa</label>
        <input type="text" id="legalName" formControlName="legalName">

        <label for="tipoEmpresa">Tipo de Empresa</label>
        <select id="tipoEmpresa" formControlName="tipoEmpresa">
          <option value="" disabled>Selecciona una opción...</option>
          <option value="SAS">S.A.S. (Sociedad por Acciones Simplificada)</option>
          <option value="LTDA">Sociedad Limitada (Ltda.)</option>
          <option value="SA">Sociedad Anónima (S.A.)</option>
          <option value="ESAL">Fundación / ONG (Sin Ánimo de Lucro)</option>
          <option value="PUBLICA">Entidad del Estado / Pública</option>
        </select>

        <div class="input-row">
          <div class="input-group">
            <label for="department">Departamento</label>
            <select id="department" formControlName="department" (change)="onDepartamentoChange($event)">
              <option value="" disabled>Seleccione...</option>
              <option *ngFor="let depto of departamentos" [value]="depto">{{ depto }}</option>
            </select>
          </div>

          <div class="input-group">
            <label for="city">Ciudad / Municipio</label>
            <select id="city" formControlName="city">
              <option value="" disabled>Seleccione...</option>
              <option *ngFor="let mun of municipiosFiltrados" [value]="mun">{{ mun }}</option>
            </select>
          </div>
        </div>

        <label for="direccionEmpresa">Dirección</label>
        <input type="text" id="direccionEmpresa" formControlName="direccionEmpresa" placeholder="Ej: Calle 123 #45-67">
      </div>

      <div class="form-column">
        <h3>Representante Legal y Acceso</h3>

        <label for="nameRepresentive">Nombres del Representante</label>
        <input type="text" id="nameRepresentive" formControlName="nameRepresentive">

        <label for="lastNameRepresentive">Apellidos del Representante</label>
        <input type="text" id="lastNameRepresentive" formControlName="lastNameRepresentive">

        <label for="numberDocument">Documento de Identidad</label>
        <input type="text" id="numberDocument" formControlName="numberDocument">

        <label for="telefonoEmpresa">Teléfono Corporativo</label>
        <input type="tel" id="telefonoEmpresa" formControlName="telefonoEmpresa">

        <hr class="divider">

        <label for="correo">Correo corporativo</label>
        <input type="email" id="correo" formControlName="correo" placeholder="ejemplo@empresa.com">

        <label for="contrasenia">Contraseña</label>
        <input type="password" id="contrasenia" formControlName="contrasenia" placeholder="Mínimo 8 caracteres">
      </div>

    </div>

    <div class="form-actions">
      <button type="submit" class="submit-btn" [disabled]="formularioEmpresa.invalid">
        Solicitar registro de empresa
      </button>
      <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
    </div>

  </form>
</main>

<app-footer></app-footer>
