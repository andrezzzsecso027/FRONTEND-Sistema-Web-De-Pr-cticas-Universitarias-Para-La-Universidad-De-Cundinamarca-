<app-navbar></app-navbar>

<main class="auth">
  <h1>Iniciar Sesión</h1>

  <div *ngIf="mensajeError" style="background:#FCEBEB; color:#A8261C; padding:12px; border-radius:8px; margin-bottom:16px; border-left:4px solid #C62828; text-align:left; font-size:0.9rem;">
    {{ mensajeError }}
  </div>

  <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label for="email">Correo Electrónico</label>
    <input type="email" id="email" formControlName="email" placeholder="tu@correo.com">

    <label for="password">Contraseña</label>
    <input type="password" id="password" formControlName="password" placeholder="••••••••">

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Verificando...' : 'INICIAR SESIÓN' }}
    </button>
  </form>

  <p class="auth-link">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</main>

<app-footer></app-footer>
