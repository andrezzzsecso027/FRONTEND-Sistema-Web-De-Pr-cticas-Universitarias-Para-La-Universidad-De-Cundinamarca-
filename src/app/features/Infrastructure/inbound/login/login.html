<app-navbar></app-navbar>

<main class="auth">
  <h1>Iniciar sesión</h1>

  <!-- La clave está en [formGroup] y (ngSubmit) -->
<form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  
  <label for="correo">Correo Electrónico</label>
  <!-- formControlName debe coincidir EXACTAMENTE con tu archivo .ts -->
  <input type="email" id="correo" formControlName="correo">

  <label for="contrasenia">Contraseña</label>
  <input type="password" id="contrasenia" formControlName="contrasenia">

  <!-- El botón debe ser tipo submit -->
  <button type="submit" [disabled]="loginForm.invalid">Iniciar Sesión</button>
  
</form>
  <p class="auth-link">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</main>

<app-footer></app-footer>
