<app-navbar></app-navbar>

<main class="auth">
  <h1>Registro de Estudiante</h1>

  <form class="auth-form" [formGroup]="formularioEstudiante" (ngSubmit)="onSubmit()">
    
    <label for="documento">Documento de Identidad</label>
    <input type="text" id="documento" formControlName="documento">

    <label for="nombreEstudiante">Nombres</label>
    <input type="text" id="nombreEstudiante" formControlName="nombreEstudiante">

    <label for="apellidoEstudiante">Apellidos</label>
    <input type="text" id="apellidoEstudiante" formControlName="apellidoEstudiante">

   <label for="sede">Sede Universitaria</label>
  <select id="sede" formControlName="sede" (change)="onSedeChange($event)">
    <option value="" disabled selected>Selecciona tu sede</option>
    <option value="fusagasuga">Fusagasugá</option>
    <option value="chia">Chía</option>
    <option value="soacha">Soacha</option>
    <option value="zipaquira">Zipaquirá</option>
    <option value="girardot">Girardot</option>
    <option value="ubate">Ubaté</option>
  </select>

  <label for="programaAcademico">Programa Académico</label>
  <select id="programaAcademico" formControlName="programaAcademico">
    <option value="" disabled selected>Selecciona tu programa</option>
    <option *ngFor="let programa of programasDisponibles" [value]="programa">
      {{ programa }}
    </option>
  </select>
    <label for="direccion">Dirección</label>
    <input type="text" id="direccion" formControlName="direccion">

    <label for="telefono">Teléfono</label>
    <input type="tel" id="telefono" formControlName="telefono">

    <label for="correo">Correo Institucional</label>
    <input type="email" id="correo" formControlName="correo">

    <label for="contrasenia">Contraseña</label>
    <input type="password" id="contrasenia" formControlName="contrasenia">

    <button type="submit" [disabled]="formularioEstudiante.invalid">Registrarse</button>
  </form>

  <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</main>

<app-footer></app-footer>
