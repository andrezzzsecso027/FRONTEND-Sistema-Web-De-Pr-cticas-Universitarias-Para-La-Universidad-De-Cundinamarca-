<app-navbar></app-navbar>

<main class="verificar-page">
  <div class="verificar-card">

    <div class="verificar-icon">✉️</div>

    <h1>Verifica tu Cuenta</h1>
    <p class="verificar-subtitle">
      Ingresa el código de verificación que enviamos a tu correo institucional.
    </p>

    <div *ngIf="mensajeExito" class="alert alert-success">
      {{ mensajeExito }}
    </div>
    <div *ngIf="mensajeError" class="alert alert-error">
      {{ mensajeError }}
    </div>

    <form [formGroup]="verificarForm" (ngSubmit)="onSubmit()" class="verificar-form">

      <label for="email">Correo Institucional</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="tu.nombre@ucundinamarca.edu.co">

      <label for="code">Código de Verificación</label>
      <input
        type="text"
        id="code"
        formControlName="code"
        placeholder="Ej: 123456"
        maxlength="10">

      <button type="submit" [disabled]="verificarForm.invalid || cargando">
        {{ cargando ? 'Verificando...' : 'Verificar Cuenta' }}
      </button>

    </form>

    <p class="verificar-footer">
      ¿Ya verificaste? <a routerLink="/login">Inicia sesión aquí</a>
    </p>

  </div>
</main>

<app-footer></app-footer>
