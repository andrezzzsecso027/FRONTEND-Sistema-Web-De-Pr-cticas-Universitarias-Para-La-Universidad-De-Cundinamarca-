<div class="ui-modal-backdrop" (click)="cerrar.emit()">
  <div class="ui-modal ui-modal--sm" role="dialog" aria-modal="true" aria-labelledby="modal-password-titulo" (click)="$event.stopPropagation()">
    <div class="ui-modal__header">
      <div>
        <span class="ui-eyebrow"><ui-icon name="shield-check" [size]="14" /> Seguridad de la cuenta</span>
        <h3 id="modal-password-titulo">Cambiar contraseña</h3>
        <p>La nueva contraseña debe tener al menos 6 caracteres.</p>
      </div>
      <button type="button" class="ui-close" aria-label="Cerrar" (click)="cerrar.emit()"><ui-icon name="x" /></button>
    </div>

    <form class="ui-modal__body" (ngSubmit)="guardar()">
      <div class="ui-field">
        <label for="pwd-actual">Contraseña actual</label>
        <input id="pwd-actual" name="actual" type="password" class="ui-input" autocomplete="current-password" [(ngModel)]="passwordActual" />
      </div>
      <div class="ui-field">
        <label for="pwd-nueva">Nueva contraseña</label>
        <input id="pwd-nueva" name="nueva" type="password" class="ui-input" autocomplete="new-password" [(ngModel)]="passwordNueva" />
      </div>
      <div class="ui-field">
        <label for="pwd-confirmar">Confirmar nueva contraseña</label>
        <input id="pwd-confirmar" name="confirmar" type="password" class="ui-input" autocomplete="new-password" [(ngModel)]="passwordConfirmar" />
      </div>

      @if (mensajeError) {
        <div class="ui-alert ui-alert--error" role="alert"><ui-icon name="alert" /> <span>{{ mensajeError }}</span></div>
      }
      @if (mensajeExito) {
        <div class="ui-alert ui-alert--success" role="status"><ui-icon name="check-circle" /> <span>{{ mensajeExito }}</span></div>
      }
      <button type="submit" hidden></button>
    </form>

    <div class="ui-modal__footer">
      <button type="button" class="ui-btn ui-btn--ghost" (click)="cerrar.emit()">Cancelar</button>
      <button type="button" class="ui-btn ui-btn--dark" [disabled]="cargando" (click)="guardar()">
        {{ cargando ? 'Actualizando…' : 'Actualizar contraseña' }}
      </button>
    </div>
  </div>
</div>
